[[permission]]
identifier = "allow-main-commands"
description = "Main window may invoke ClipAnchor application commands."
commands.allow = [
  "get_bootstrap",
  "list_language_packs",
  "open_language_pack_folder",
  "read_clipboard_text_for_input",
  "save_language_pack",
  "delete_language_pack",
  "log_language_pack_event",
  "translate_ui_text",
  "save_settings",
  "check_shortcut_conflicts",
  "set_pin_service",
  "set_history_service",
  "set_privacy_mode",
  "set_privacy_filter_mode",
  "set_clipboard_paused",
  "set_autostart",
  "list_history",
  "delete_records",
  "delete_records_force",
  "clear_all_data",
  "delete_history_before_days",
  "toggle_record_pin",
  "create_text_record",
  "update_text_record",
  "pin_history_item",
  "validate_record",
  "validate_favorites",
  "toggle_popup_favorite",
  "copy_item",
  "get_popup_item",
  "read_image_data_url",
  "read_file_previews",
  "close_popup",
  "pin_popup",
  "resize_popup",
  "refresh_popup_shape",
  "save_popup_position",
  "export_history",
  "import_history",
  "get_data_usage",
  "get_log_status",
  "clear_logs",
  "open_log_folder",
  "get_update_status",
  "check_update",
  "install_downloaded_update",
  "dismiss_update_prompt",
  "minimize_window",
  "toggle_maximize_window",
  "close_main_window",
  "quit_app"
]
