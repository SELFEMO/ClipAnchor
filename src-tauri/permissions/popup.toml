[[permission]]
identifier = "allow-popup-commands"
description = "Popup windows may invoke only clipboard-card commands."
commands.allow = [
  "get_bootstrap",
  "list_language_packs",
  "get_popup_item",
  "read_image_data_url",
  "read_file_previews",
  "close_popup",
  "pin_popup",
  "resize_popup",
  "refresh_popup_shape",
  "toggle_popup_favorite",
  "copy_item",
  "update_text_record"
]
